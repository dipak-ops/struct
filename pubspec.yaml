name: struct_app
description: Offline-first decentralized BLE mesh messenger. Created by Dipak Bhondekar.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local reactive SQLite database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # Cryptography (Ed25519, X25519, ChaCha20-Poly1305, HKDF)
  cryptography: ^2.7.0
  
  # Secure hardware-backed storage (Keystore / Keychain)
  flutter_secure_storage: ^9.2.0

  # Native BLE Peripheral & Central GATT streams
  flutter_reactive_ble: ^5.3.1
  permission_handler: ^11.3.1

  # Out-of-band verification & biometrics
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0
  local_auth: ^2.2.0

  # State management & utilities
  flutter_riverpod: ^2.5.1
  uuid: ^4.4.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
